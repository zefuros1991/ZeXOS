# Replaces broadcom-wl-dkms' own file of this name, which blocks the
# open-source Broadcom drivers (b43, bcma, brcmfmac…) on every computer and
# would break Wi-Fi on the chips that need them. Instead wl stays off by
# default, and zexos-broadcom.service turns it on (and blocks the others)
# only for a chip on ZeXOS's Broadcom list.
blacklist wl
