---
units:
    - name: NetworkManager
      action: enable
      mandatory: true
    # The installer copies the live ISO's /etc/resolv.conf, which points at
    # systemd-resolved. Without it running, Wi-Fi connects but no website
    # name can be looked up ("IP but no internet").
    - name: systemd-resolved
      action: enable
      mandatory: true
    - name: systemd-timesyncd
      action: enable
      mandatory: false
    - name: fstrim.timer
      action: enable
      mandatory: false
