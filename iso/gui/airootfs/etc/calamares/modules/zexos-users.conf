---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - rfkill
    - sys
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
# Same as CachyOS: at least 4 characters, no strength rules, so quick
# test installs (e.g. in a VM) are not a chore.
passwordRequirements:
    minLength: 4
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-zexos"
    forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
