# ZeXOS installer (Calamares). Our own module settings are named zexos-*.conf
# so they never collide with the defaults the calamares package ships.
---
modules-search: [ local ]

instances:
- { id: zexos,       module: welcome,          config: zexos-welcome.conf }
- { id: zexos,       module: locale,           config: zexos-locale.conf }
- { id: zexos,       module: keyboard,         config: zexos-keyboard.conf }
- { id: zexos,       module: partition,        config: zexos-partition.conf }
- { id: compositors, module: packagechooserq,  config: zexos-compositors.conf }
- { id: shells,      module: packagechooserq,  config: zexos-shells.conf }
- { id: zexos,       module: users,            config: zexos-users.conf }
- { id: zexos,       module: mount,            config: zexos-mount.conf }
- { id: pacstrap,    module: shellprocess,     config: zexos-pacstrap.conf }
- { id: zexos,       module: machineid,        config: zexos-machineid.conf }
- { id: zexos,       module: fstab,            config: zexos-fstab.conf }
- { id: zexos,       module: services-systemd, config: zexos-services.conf }
- { id: bootloader,  module: shellprocess,     config: zexos-bootloader.conf }
- { id: desktop,     module: shellprocess,     config: zexos-desktop.conf }
- { id: zexos,       module: finished,         config: zexos-finished.conf }

sequence:
- show:
  - welcome@zexos
  - locale@zexos
  - keyboard@zexos
  - partition@zexos
  - packagechooserq@compositors
  - packagechooserq@shells
  - users@zexos
  - summary
- exec:
  - partition@zexos
  - mount@zexos
  - shellprocess@pacstrap
  - machineid@zexos
  - fstab@zexos
  - locale@zexos
  - keyboard@zexos
  - localecfg
  - users@zexos
  - networkcfg
  - hwclock
  - services-systemd@zexos
  - shellprocess@bootloader
  - shellprocess@desktop
  - umount
- show:
  - finished@zexos

branding: zexos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
