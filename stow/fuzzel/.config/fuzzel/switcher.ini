# fuzzel look for the shell switcher (Mod+Shift+D), made to match the
# shells' own launchers: the same font, round corners, roomy rows and each
# shell's logo before its name. The cheat sheet keeps fuzzel.ini.
# All options: `man fuzzel.ini`

# Colours: the same wallpaper colours as every other menu.
include=~/.config/fuzzel/themes/shell

[main]
font=Noto Sans:size=15
prompt=""
placeholder=Switch desktop shell
# Row height in points; the logos are drawn at this size.
line-height=46
width=26
lines=2
minimal-lines=yes
horizontal-pad=28
vertical-pad=22
inner-pad=16
# No big preview picture when only a few entries match.
image-size-ratio=0

[border]
width=2
radius=24
selection-radius=14
