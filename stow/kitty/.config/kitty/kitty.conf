# kitty terminal
# All options: https://sw.kovidgoyal.net/kitty/conf/

# Colours come from the wallpaper (Noctalia writes this file).
include themes/noctalia.conf
# With DankMaterialShell, zshell writes themes/shell.conf so DMS's colours
# win. globinclude skips it quietly when it isn't there yet.
globinclude themes/shell.conf

# Text
font_family JetBrainsMono Nerd Font
font_size   12

# See-through background (1.0 = solid). niri adds blur behind it.
background_opacity 0.85

# Start your own shell through a small ZeXOS script that shows fastfetch
# first, unless your shell already does. See ~/.local/bin/zexos-kitty-shell.
shell $HOME/.local/bin/zexos-kitty-shell
