# How things move
#
# ZeXOS defaults, the same as niri and Hyprland: windows zoom in from 80% and out on close,
# workspaces slide up and down with a small bounce.
# To pick another style run `zexos-motion` (it writes ../motion.conf, loaded after this).
# More: https://mangowm.github.io/docs/visuals/animations

animations=1
tag_animation_direction=0
animation_type_open=zoom
animation_type_close=zoom
zoom_initial_ratio=0.8
zoom_end_ratio=0.8
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0
fade_out_begin_opacity=1
animation_duration_open=350
animation_duration_close=300
animation_duration_move=450
animation_duration_tag=450
animation_curve_open=0.22,1,0.36,1
animation_curve_close=0.22,1,0.36,1
animation_curve_move=0.34,1.3,0.64,1
animation_curve_tag=0.34,1.3,0.64,1
animation_curve_opacity_fade_in=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.22,1,0.36,1
