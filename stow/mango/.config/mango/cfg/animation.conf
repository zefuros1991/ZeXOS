# How things move
#
# ZeXOS defaults, the same as niri and Hyprland: windows rise up with a small
# bounce and sink on close, workspaces slide up and down with the same bounce.
# To pick another style run `zexos-motion` (it writes ../motion.conf, loaded after this).
# More: https://mangowm.github.io/docs/visuals/animations

animations=1
tag_animation_direction=0
animation_type_open=slide
animation_type_close=slide
zoom_initial_ratio=0.9
zoom_end_ratio=0.9
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0
fadeout_begin_opacity=1
animation_duration_open=420
animation_duration_close=240
animation_duration_move=450
animation_duration_tag=450
animation_curve_open=0.34,1.3,0.64,1
animation_curve_close=0.65,0,0.35,1
animation_curve_move=0.34,1.3,0.64,1
animation_curve_tag=0.34,1.3,0.64,1
animation_curve_opafadein=0.22,1,0.36,1
animation_curve_opafadeout=0.22,1,0.36,1
