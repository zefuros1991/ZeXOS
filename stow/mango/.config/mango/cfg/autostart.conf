# Things that start when you log in

# The overview (Super+O, four fingers up). Runs quietly
# until opened. Start it before the shell, so the shell's menus open on top.
exec_once=mango-overview

# Lines the windows back up half-and-half after a 3-finger sideways swipe.
exec_once=zexos-scroll-snap

# The desktop shell: top bar, launcher, notifications, lock screen.
# zshell starts the one you picked (Noctalia or DankMaterialShell);
# press Mod+Shift+D to change it.
exec_once=zshell start
exec_once=zexos-vm-cursor

# The small window that asks for your password when an app needs admin rights.
exec_once=/usr/lib/polkit-kde-authentication-agent-1
