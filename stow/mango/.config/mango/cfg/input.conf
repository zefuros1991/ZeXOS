# Keyboard, touchpad and mouse
# All options: https://mangowm.github.io/docs/configuration/input

# Keyboard layout. Example for English + Greek, switched with Alt+Shift:
#   xkb_rules_layout=us,gr
#   xkb_rules_options=grp:alt_shift_toggle
xkb_rules_layout=us

# Number pad works right after login.
numlockon=1

# Touchpad: a light tap counts as a click, and content follows your
# fingers, like a phone. (Changes here need a new login.)
tap_to_click=1
trackpad_natural_scrolling=1

# Moving the pointer over a window gives it focus, no click needed.
sloppyfocus=1

# The pointer stays where it is when you focus a window with the keyboard.
# Set to 1 to make it jump to the window instead.
warpcursor=0
