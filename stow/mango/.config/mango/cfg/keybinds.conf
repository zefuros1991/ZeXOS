# Keyboard shortcuts
#
# "SUPER" is the Mod key (the one with the Windows logo).
# Each line reads: bind=KEYS,KEY,what happens,details
# The "# ..." line right above a bind is its name on the shortcut cheat
# sheet (Mod+F1). Keep it on its own line: Mango would pass a comment at the
# end of a bind line on to the command.
# Shell actions go through `zshell`, so they work the same in Noctalia and
# DankMaterialShell. `zshell --help` lists them.
# All options: https://mangowm.github.io/docs/bindings/keys


# === Help ===
# Shortcut cheat sheet
bind=SUPER,F1,spawn,zshell cheatsheet
# Shortcut cheat sheet
bind=SUPER+SHIFT,Escape,spawn,zshell cheatsheet

# === Open apps ===
# App launcher
bind=SUPER,space,spawn,zshell launcher
# Terminal (kitty)
bind=SUPER,c,spawn,kitty
# Web browser (your default)
bind=SUPER,b,spawn_shell,~/.local/bin/zexos-browser
# Files (Dolphin)
bind=SUPER,e,spawn,dolphin
# Install and update apps
bind=SUPER,m,spawn_shell,~/.local/bin/zexos-app-store

# === Wallpaper ===
# Pick a wallpaper (roller)
bind=SUPER,w,spawn_shell,pkill -x roller || PATH=$HOME/.local/share/roller/bin:$PATH roller
# Pick an animated wallpaper
bind=SUPER+SHIFT,w,spawn_shell,pkill -x roller || PATH=$HOME/.local/share/roller/bin:$PATH roller --animated
# Random wallpaper
bind=SUPER+CTRL,w,spawn,zshell wallpaper-random

# === Session ===
# Lock the screen
bind=SUPER,l,spawn,zshell lock
# Log out / restart / shut down
bind=SUPER,Escape,spawn,zshell session
# Change desktop shell (Noctalia / DMS)
bind=SUPER+SHIFT,d,spawn,zshell menu
# Screens off (press a key to wake them)
bind=SUPER+SHIFT,p,sleep_toggle_monitor,.*
# Leave Mango and go back to the login screen
bind=CTRL+ALT,Delete,quit
# Reload this configuration
bind=SUPER+SHIFT,r,reload_config

# === Laptop keys: sound, music, brightness ===
# These work even on the lock screen (bindl).
# Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,zshell volume-up
# Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,zshell volume-down
# Mute sound
bindl=NONE,XF86AudioMute,spawn,zshell volume-mute
# Mute microphone
bindl=NONE,XF86AudioMicMute,spawn,zshell mic-mute
# Play / pause music
bindl=NONE,XF86AudioPlay,spawn,zshell media-toggle
# Next track
bindl=NONE,XF86AudioNext,spawn,zshell media-next
# Previous track
bindl=NONE,XF86AudioPrev,spawn,zshell media-prev
# Screen brighter
bindl=NONE,XF86MonBrightnessUp,spawn,zshell brightness-up
# Screen dimmer
bindl=NONE,XF86MonBrightnessDown,spawn,zshell brightness-down

# === Windows ===
# Close the window
bind=SUPER,q,killclient
# Float the window / put it back
bind=SUPER,t,togglefloating
# Full width, bar stays visible
bind=SUPER,f,togglemaximizescreen
# Full screen, bar hidden
bind=SUPER+SHIFT,f,togglefullscreen
# Overview of every workspace
bind=SUPER,o,toggleoverview
# Carousel: hold Alt, press Tab to go through every window, let go of Alt
# to jump to it. Shift goes backwards.
bind=ALT,Tab,overcircle,next
bind=ALT+SHIFT,Tab,overcircle,prev

# === Move focus (arrows) ===
# Focus the window to the left
bind=SUPER,Left,focusdir,left
# Focus the window to the right
bind=SUPER,Right,focusdir,right
# Focus the window above
bind=SUPER,Up,focusdir,up
# Focus the window below
bind=SUPER,Down,focusdir,down

# === Move the window itself (add Ctrl) ===
# Arrow keys or the vim keys H J K L both work.
# Move the window left
bind=SUPER+CTRL,Left,exchange_client,left
# Move the window left
bind=SUPER+CTRL,h,exchange_client,left
# Move the window right
bind=SUPER+CTRL,Right,exchange_client,right
# Move the window right
bind=SUPER+CTRL,l,exchange_client,right
# Move the window up
bind=SUPER+CTRL,Up,exchange_client,up
# Move the window up
bind=SUPER+CTRL,k,exchange_client,up
# Move the window down
bind=SUPER+CTRL,Down,exchange_client,down
# Move the window down
bind=SUPER+CTRL,j,exchange_client,down

# === Sizes ===
# Widths step through the list in layout.conf (scroller_proportion_preset).
# Narrower window
bind=SUPER,minus,switch_proportion_preset,prev
# Wider window
bind=SUPER,equal,switch_proportion_preset,next
# Full width
bind=SUPER+CTRL,f,set_proportion,1.0

# === Several screens (add Shift) ===
# Focus the screen left
bind=SUPER+SHIFT,Left,focusmon,left
# Focus the screen right
bind=SUPER+SHIFT,Right,focusmon,right
# Focus the screen above
bind=SUPER+SHIFT,Up,focusmon,up
# Focus the screen below
bind=SUPER+SHIFT,Down,focusmon,down
# ...and Shift+Ctrl carries the window with you.
# Move the window to the screen left
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
# Move the window to the screen right
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
# Move the window to the screen above
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
# Move the window to the screen below
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

# === Workspaces ===
# Mango calls workspaces "tags". Mod+number goes to that workspace;
# Mod+Ctrl+number takes the window along.
# Workspace 1
bind=SUPER,1,view,1
# Workspace 2
bind=SUPER,2,view,2
# Workspace 3
bind=SUPER,3,view,3
# Workspace 4
bind=SUPER,4,view,4
# Workspace 5
bind=SUPER,5,view,5
# Workspace 6
bind=SUPER,6,view,6
# Workspace 7
bind=SUPER,7,view,7
# Workspace 8
bind=SUPER,8,view,8
# Workspace 9
bind=SUPER,9,view,9
# Move the window to workspace 1
bind=SUPER+CTRL,1,tag,1
# Move the window to workspace 2
bind=SUPER+CTRL,2,tag,2
# Move the window to workspace 3
bind=SUPER+CTRL,3,tag,3
# Move the window to workspace 4
bind=SUPER+CTRL,4,tag,4
# Move the window to workspace 5
bind=SUPER+CTRL,5,tag,5
# Move the window to workspace 6
bind=SUPER+CTRL,6,tag,6
# Move the window to workspace 7
bind=SUPER+CTRL,7,tag,7
# Move the window to workspace 8
bind=SUPER+CTRL,8,tag,8
# Move the window to workspace 9
bind=SUPER+CTRL,9,tag,9
# Back to the last workspace
bind=SUPER,Tab,view,-1

# === Screenshots ===
# Saved to ~/Pictures/Screenshots and copied to the clipboard.
# Screenshot of an area (drag to pick it)
bind=SUPER+SHIFT,s,spawn,zexos-screenshot area
# Screenshot of the whole screen
bind=CTRL+SHIFT,s,spawn,zexos-screenshot screen
# Screenshot of the focused window
bind=ALT+SHIFT,3,spawn,zexos-screenshot window

# === Mouse ===
# Hold Mod and drag with the left button to move a window, with the right
# button to resize it.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Hold Mod and scroll: up/down changes workspace, sideways moves between
# windows. Add Ctrl to take the window along.
# Previous workspace
axisbind=SUPER,UP,viewtoleft
# Next workspace: at most one empty one after the last with windows,
# like niri (zexos-next-workspace checks)
axisbind=SUPER,DOWN,spawn,zexos-next-workspace
# Focus the window to the left
axisbind=SUPER,LEFT,focusdir,left
# Focus the window to the right
axisbind=SUPER,RIGHT,focusdir,right
# Move the window to the previous workspace
axisbind=SUPER+CTRL,UP,tagtoleft
# Move the window to the next workspace
axisbind=SUPER+CTRL,DOWN,tagtoright
# Move the window left
axisbind=SUPER+CTRL,LEFT,exchange_client,left
# Move the window right
axisbind=SUPER+CTRL,RIGHT,exchange_client,right

# Touchpad swipes, like niri: the desktop follows your fingers.
# https://mangowm.github.io/docs/bindings/mouse-gestures
# Three fingers sideways: move between the windows on this workspace.
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
# Three fingers up or down: next or previous workspace that has windows.
# The desktop follows your fingers, and one swipe can go through several.
gesturebind=none,up,3,viewtoright_have_client,0
gesturebind=none,down,3,viewtoleft_have_client,0
# Four fingers up opens the overview, down closes it.
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
