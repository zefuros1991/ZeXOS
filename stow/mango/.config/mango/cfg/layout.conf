# How windows are placed and sized
#
# Every workspace uses the "scroller" layout: windows sit side by side on
# an endless strip that scrolls left and right. Think of a row of photos on
# a table: you slide the row instead of stacking photos on top of each
# other. It works like niri.
# More: https://mangowm.github.io/docs/window-management/layouts

# Mango calls workspaces "tags". All nine use the scroller.
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Space between windows and at the screen edges, in pixels.
gap_inner_horizontal=9
gap_inner_vertical=9
gap_outer_horizontal=9
gap_outer_vertical=9

# New windows take half the screen width.
scroller_default_proportion=0.5

# A lone window also takes half the width, in the middle of the screen.
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.5

# Slide a window to the middle only when it would not fit on screen next
# to the one you came from. (The two lines before it must be 0 for it to
# work.)
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1

# Widths that Mod+Minus and Mod+Equal step through: a quarter, a third,
# half, two thirds, three quarters and the whole screen.
scroller_proportion_preset=0.25,0.333,0.5,0.667,0.75,1.0

# Frame around every window. The colours are placeholders: noctalia.conf
# replaces them with colours from your wallpaper.
border_px=4
border_color=0x505050ff
focus_color=0xffc87fff
urgent_color=0x9b0000ff

# Rounded corners.
border_radius=14

# Windows you're not using are dimmed a little, so the active one stands
# out: a see-through black layer on top of them (the last two digits are
# how dark, 00-ff). Mango can't draw a gradient border, only one colour.
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0000005a
