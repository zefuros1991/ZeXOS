# Small settings that don't fit anywhere else
#
# Apps draw no title bars of their own here (Mango's default), so windows
# look clean and the border draws neatly around them.
# Screenshots are saved to ~/Pictures/Screenshots by zexos-screenshot,
# see the keys in keybinds.conf.

# Settings passed to every app started from the desktop.
# Qt apps (Dolphin, VLC...) take their look from qt6ct...
env=QT_QPA_PLATFORMTHEME,qt6ct
# ...and are drawn 20% bigger.
env=QT_SCALE_FACTOR,1.2

# Clicking a notification brings its window to the front.
focus_on_activate=1

# Hold Mod and scroll: at most one workspace change every 150 ms, so one
# flick doesn't skip several workspaces at once.
axis_bind_apply_timeout=150

# Push the mouse into the top-left corner to open the overview, like niri.
# Mod+O opens it too.
enable_hotarea=1
hotarea_corner=0
