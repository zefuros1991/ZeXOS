# Looks and per-app tweaks
#
# "windowrule" changes app windows. Each rule: what changes, then which
# app it is for (a pattern matched against the app's id).
# More: https://mangowm.github.io/docs/window-management/rules

# ── All windows ─────────────────────────────────────────

# Windows you're not using fade slightly, so the active one stands out.
focused_opacity=1.0
unfocused_opacity=0.86

# No shadows (the same as niri here). Set to 1 to try them.
shadows=0

# The desktop shell's own pieces get no shadow or slide-in. Blur is
# switched on for them, then off for everything except Noctalia's pop-up
# panels: Mango can't take blur requests from the shell (niri can), so
# without this the pop-ups are plain see-through. The bar stays unblurred,
# which keeps the gaps between its islands clear.
blur_layer=1
layerrule=noblur:1,layer_name:^(?!noctalia-(attached-)?panel$).*$
layer_shadows=0
layer_animations=0

# ── Apps ────────────────────────────────────────────────

# Frosted-glass blur behind see-through windows. It is switched on for
# everything here, then switched off for every app except kitty, VLC and
# Dolphin, so only those three get it.
blur=1
blur_optimized=1
windowrule=noblur:1,appid:^(?!(kitty|vlc|org\.kde\.dolphin)$).*$

# Noctalia's settings window floats above the others.
windowrule=isfloating:1,appid:^dev\.noctalia\.Noctalia$
