# ZeXOS — Mango main file
#
# Mango is a second window manager you can pick at the login screen. This
# setup copies the niri one: windows side by side on a strip that scrolls
# ("scroller" layout), same keys, same looks, same two desktop shells.
#
# This file only pulls in the smaller files below, one per topic.
# Change things in those files, not here.
# Full option list: https://mangowm.github.io/docs

source=./cfg/animation.conf
source=./cfg/autostart.conf
source=./cfg/keybinds.conf
source=./cfg/input.conf
source=./cfg/layout.conf
source=./cfg/rules.conf
source=./cfg/misc.conf

# Colours made from your wallpaper. Noctalia rewrites this file on its own,
# so don't edit it. It comes after layout.conf so its colours win.
source-optional=./noctalia.conf

# When you use DankMaterialShell instead, `zshell` writes this file so it
# loads DMS's wallpaper colours, which then win over Noctalia's. With
# Noctalia it is only a comment. Don't edit it by hand.
source-optional=./shell-colors.conf

# Mouse pointer look
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# Your screens (empty until you add something, see the file)
source-optional=./monitors.conf
