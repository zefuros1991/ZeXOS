# Your screens
#
# Empty = Mango picks the best mode for every screen by itself.
# Example, a laptop screen at 120 Hz, drawn 25% bigger:
#   monitorrule=name:eDP-1,width:2560,height:1600,refresh:120,x:0,y:0,scale:1.25
# `mmsg get all-monitors` lists the names of your screens.
# More: https://mangowm.github.io/docs/configuration/monitors
