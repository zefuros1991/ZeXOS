# Which helper answers each desktop request (file dialogs, screen sharing,
# ...) inside niri. This replaces niri's own copy in
# /usr/share/xdg-desktop-portal/ and is the same except for one line:
# file dialogs use the GTK one, because the GNOME one needs the Nautilus
# file manager and ZeXOS uses Dolphin. See niri's wiki, "Important Software".
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
