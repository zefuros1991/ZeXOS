# Noctalia settings (the top bar, pop-up panels, lock screen and colours).
#
# Noctalia reads every .toml file in this folder. Anything you change in
# its settings window is saved to ~/.local/state/noctalia/settings.toml
# instead, and wins over this file.
# Lines marked "ZeXOS patch" only work with the patched build in
# packaging/noctalia-zexos.

# ═══ Top bar ════════════════════════════════════════════════════════════════
# The bar itself is invisible. What you see are three rounded "islands"
# (left, middle, right) hanging from the top edge of the screen.

[bar.default]
position = "top"
start  = ["group:left"]
center = ["group:middle"]
end    = ["group:right"]

# Size
thickness = 36
scale = 1.25
font_scale = 1.3
capsule = false
capsule_thickness = 1.0   # islands are as tall as the bar, so they touch the top (ZeXOS patch)

# Spacing, in pixels
margin_edge = 0
margin_ends = 4
padding = 8
widget_spacing = 6

# See-through bar, no shadow
background_opacity = 0.0
shadow = false

# The three islands. They look the same; only their contents differ.
# attached = true gives them square top corners so they hang off the edge (ZeXOS patch).

[[bar.default.capsule_group]]
id = "left"
members = ["sysmon", "arch_updates", "usb"]   # system monitor, update counter, USB drives
fill = "surface_variant"
opacity = 0.85
radius = 13.0
padding = 10
widget_spacing = 8
attached = true

[[bar.default.capsule_group]]
id = "middle"
members = ["workspaces", "clock", "media"]
fill = "surface_variant"
opacity = 0.85
radius = 13.0
padding = 10
widget_spacing = 8
attached = true

[[bar.default.capsule_group]]
id = "right"
members = ["tray", "bluetooth", "volume", "notifications", "battery", "brightness", "network", "shell_switch"]
fill = "surface_variant"
opacity = 0.85
radius = 13.0
padding = 10
widget_spacing = 8
attached = true

# ─── Widget settings ───
# Long song titles get cut off at this width.
[widget.media]
type = "media"
max_length = 145.0

# Shows e.g. "14:05  Mon, Sep 27"
[widget.clock]
type = "clock"
format = "{:%H:%M  %a, %b %d}"

# Opens the menu to change the desktop shell, like Mod+Shift+D.
# DankMaterialShell has the same button on its bar.
[widget.shell_switch]
type = "custom_button"
glyph = "switch-horizontal"
tooltip = "Change desktop shell"

[widget.shell_switch.actions]
left = "exec zshell menu"

# These two come from plugins (see below).
[widget.arch_updates]
type = "yuuto/arch-updater:widget"

[widget.usb]
type = "aristides/udiskie:status"

# ═══ Plugins ════════════════════════════════════════════════════════════════
# arch-updater: counts waiting updates.  udiskie: USB drives.
# keybind-cheatsheet: the Mod+F1 shortcut list.
# mpvpaper: plays the animated wallpapers in ~/Pictures/Wallpapers/Animated.
# The ZeXOS copy in ~/.local/share/noctalia/plugins/mpvpaper adds a `set`
# command so the wallpaper picker can start a video (see ZEXOS.md there).
# (The wallpaper picker is roller, a separate app on Mod+W / Mod+Shift+W.)

[plugins]
enabled = ["yuuto/arch-updater", "kenn/keybind-cheatsheet", "aristides/udiskie", "noctalia/mpvpaper"]
auto_update = "none"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Pictures/Wallpapers/Animated"
# The picker sets the picture itself (the video's first frame), so the plugin
# must not swap in its own extracted frame when a video stops.
extract_last_frame = false

# Plugin panels open under the widget you clicked. The USB one needs
# "attached" for that, otherwise it always opens in the middle.
[plugin_settings."aristides/udiskie"]
manager_placement = "attached"
manager_open_near_click = true

[plugin_settings."yuuto/arch-updater"]
panel_open_near_click = true

# ═══ Colours ════════════════════════════════════════════════════════════════
# Dark mode, with colours picked from the wallpaper. The templates pass
# those colours on to other apps so everything matches. "kcolorscheme"
# is the one KDE apps (Dolphin, Gwenview) need: qt6ct.conf points at the
# file it writes, and Noctalia also copies the colours into kdeglobals.

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "qt", "kcolorscheme", "niri", "mango", "hyprland", "kitty", "btop"]
community_ids = ["fuzzel"]

# niri's window borders: a gradient in the wallpaper colours round the
# focused window (our own template, used only while Noctalia is the shell).
[theme.templates.user.zexos_niri_border]
input_path  = "templates/niri-border.kdl"
output_path = "$XDG_CONFIG_HOME/niri/zexos-border.kdl"
requires_path = "$XDG_CONFIG_HOME/niri"

# ═══ Pop-up size ════════════════════════════════════════════════════════════
# ui_scale makes every panel and its text bigger (1.2 = 20% bigger).
# launcher_scale makes only the app launcher bigger again, on top of that:
# 1.2 × 1.0833 ≈ 1.3 in total (ZeXOS patch).

[accessibility]
ui_scale = 1.2
launcher_scale = 1.0833

# ═══ Shell behaviour ════════════════════════════════════════════════════════

[shell]
time_format = "{:%H:%M}"
telemetry_enabled = false      # send nothing home
setup_wizard_enabled = false   # skip the first-start wizard

[shell.panel]
# Panels open under the icon you clicked instead of the middle of the bar.
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true
# Frosted-glass look for all pop-ups.
transparency_mode = "glass"

# Apps pinned at the top of the launcher.
[shell.launcher]
pinned = ["kitty", "org.kde.dolphin"]

# ─── Power menu (Mod+Escape) ───
# The buttons, top to bottom. Hibernate and "Reboot to UEFI" have no
# built-in button, so they run a command instead.

[shell.session]
show_shortcuts = true

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "suspend"

[[shell.session.actions]]
action = "command"
label = "Hibernate"
command = "systemctl hibernate"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"   # shown in red

[[shell.session.actions]]
action = "command"
label = "Reboot to UEFI"
command = "systemctl reboot --firmware-setup"

# ═══ Wallpaper ══════════════════════════════════════════════════════════════

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition_duration = 1500.0   # milliseconds
transition = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]   # one is picked at random

# The wallpaper you start with (the one in the README). finaltouches.sh
# copies the ZeXOS set from wallpapers/ into ~/Pictures/Wallpapers.
# Picking another one (Mod+W) is saved separately and wins over this.
[wallpaper.default]
path = "~/Pictures/Wallpapers/zexos-aurora.jpg"

# Every time the wallpaper changes, copy it to the login screen too, and
# switch to light mode if the new wallpaper is mostly white (dark otherwise).
[hooks]
wallpaper_changed = ["~/.local/bin/sync-sddm-wallpaper.sh", "~/.local/bin/auto-theme-mode.sh"]
# New colours are written: tell open Qt apps (Dolphin) to reload them.
colors_changed = ["~/.local/bin/zexos-qt-refresh"]

# Blurred, tinted wallpaper behind the overview (Mod+O).
# Needs the "noctalia-backdrop" rule in niri's rules.kdl.
[backdrop]
enabled = true
blur_intensity = 0.4
tint_intensity = 0.6

# ═══ Everything else ════════════════════════════════════════════════════════

[location]
auto_locate = true   # find your town for the weather

[weather]
enabled = true
unit = "metric"

[notification]
position = "top_right"

[osd]
position = "top_right"   # volume / brightness pop-up

[dock]
enabled = false

[nightlight]
enabled = false

# Screen dimming and auto-sleep are left at Noctalia's defaults (off).
