# Noctalia v5 config — ported from the v4 settings.json (kept alongside for rollback).
# v5 reads every *.toml in this folder; GUI changes land in
# ~/.local/state/noctalia/settings.toml and override this file.

# ── Bar: transparent strip with three islands attached to the top edge ───────────────────────
[bar.default]
position = "top"
thickness = 36
background_opacity = 0.0
shadow = false
margin_edge = 0
margin_ends = 4
padding = 8
widget_spacing = 6
font_scale = 1.3
scale = 1.25
capsule = false
# Islands fill the full bar height so they touch the top edge (ZeXOS patch)
capsule_thickness = 1.0
start = ["group:left"]
center = ["group:middle"]
end = ["group:right"]

[[bar.default.capsule_group]]
id = "left"
members = ["cpu", "temp", "ram", "arch_updates"]
fill = "surface_variant"
opacity = 0.85
padding = 10
radius = 13.0
attached = true  # ZeXOS noctalia patch: square top corners, hang off the top edge
widget_spacing = 8

[[bar.default.capsule_group]]
id = "middle"
members = ["active_window", "workspaces", "clock", "media"]
fill = "surface_variant"
opacity = 0.85
padding = 10
radius = 13.0
attached = true  # ZeXOS noctalia patch: square top corners, hang off the top edge
widget_spacing = 8

[[bar.default.capsule_group]]
id = "right"
members = ["tray", "usb", "bluetooth", "volume", "notifications", "battery", "brightness", "network"]
fill = "surface_variant"
opacity = 0.85
padding = 10
radius = 13.0
attached = true  # ZeXOS noctalia patch: square top corners, hang off the top edge
widget_spacing = 8

[widget.active_window]
type = "active_window"
max_length = 145.0

[widget.media]
type = "media"
max_length = 145.0

[widget.clock]
type = "clock"
format = "{:%H:%M  %a, %b %d}"

[widget.arch_updates]
type = "yuuto/arch-updater:widget"

[widget.usb]
type = "aristides/udiskie:status"

# ── Plugins ──────────────────────────────────────────────────────────────────
# v4 plugins don't run on v5. arch-updater and USB (udiskie) are community
# ports. The wallpaper picker is no longer a plugin: Mod+W opens
# roller (see stow/roller and packaging/roller).
[plugins]
auto_update = "none"
enabled = ["yuuto/arch-updater", "kenn/keybind-cheatsheet", "aristides/udiskie"]

# Same for plugin panels. "attached" is needed: a floating centre position
# overrides open-near-click.
[plugin_settings."aristides/udiskie"]
manager_placement = "attached"
manager_open_near_click = true

[plugin_settings."yuuto/arch-updater"]
panel_open_near_click = true

# ── Look & colours ───────────────────────────────────────────────────────────
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "qt", "niri", "kitty", "btop"]
community_ids = ["zen-browser", "fuzzel"]

# Popup sizes. ui_scale enlarges every panel opened from the bar (and the
# right-click control center), text included: 1.2 ≈ +2-3pt on every font.
# launcher_scale is a ZeXOS patch option, multiplied on top for the launcher
# only (1.3 / 1.2 → launcher ends up 1.3× the stock size).
[accessibility]
ui_scale       = 1.2
launcher_scale = 1.0833

[shell]
telemetry_enabled = false
setup_wizard_enabled = false
time_format = "{:%H:%M}"

# Bar panels open under the widget you clicked (still attached to the bar),
# instead of always at the bar's centre.
[shell.panel]
open_near_click_control_center = true
open_near_click_wallpaper      = true
open_near_click_session        = true
# see-through, blurred pop-ups (Noctalia has no per-panel switch)
transparency_mode              = "glass"

[shell.launcher]
pinned = ["kitty", "org.kde.dolphin", "zen-browser"]

# Power menu: v4 had hibernate + reboot-to-UEFI, which v5 only offers as custom commands.
[shell.session]
show_shortcuts = true

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "suspend"

[[shell.session.actions]]
action = "command"
label = "Hibernate"
command = "systemctl hibernate"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "logout"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"

[[shell.session.actions]]
action = "command"
label = "Reboot to UEFI"
command = "systemctl reboot --firmware-setup"

# ── Wallpaper ────────────────────────────────────────────────────────────────
[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]
transition_duration = 1500.0

# Blurred wallpaper behind niri's overview (needs the matching layer-rule in niri rules.kdl)
[backdrop]
enabled = true
blur_intensity = 0.4
tint_intensity = 0.6

# ── Misc ─────────────────────────────────────────────────────────────────────
[location]
auto_locate = true

[weather]
enabled = true
unit = "metric"

[notification]
position = "top_right"

[osd]
position = "top_right"

[dock]
enabled = false

[nightlight]
enabled = false

# idle: every behaviour is off by default (same as v4); lock-before-suspend is on by default.

[hooks]
wallpaper_changed = ["~/.local/bin/sync-sddm-wallpaper.sh"]
