# Noctalia ignores the "please close" signal at logout, reboot and
# shutdown, so systemd waited its full 90 seconds before killing it.
# This gives it 5 seconds instead. niri starts noctalia in a unit named
# app-niri-noctalia-<number>.scope, and a folder ending in "-" applies to
# every unit whose name starts with it.
[Scope]
TimeoutStopSec=5s
